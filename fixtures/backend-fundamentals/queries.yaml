fixture_set: backend-fundamentals-queries
evaluation_only: true
target_pack: backend-fundamentals
description: 'Frozen English retrieval hypotheses for 30 decisions: three positives and two boundary contrasts
  per Practice. Original query texts are retained; the removed connection target is explicitly migrated.
  Not runtime input or proof of behavior.'
queries:
- id: api-safe-read
  kind: positive
  status: frozen
  text: A link preview fetches our GET confirmation URL and accidentally submits the purchase. Where should
    confirmation happen?
  expect: backend-fundamentals.api.preserve-safe-read-semantics
- id: api-safe-read-paraphrase
  kind: positive
  status: frozen
  text: Crawlers visit a download page that also cancels an order. Is the HTTP handler safe for automated
    fetching?
  expect: backend-fundamentals.api.preserve-safe-read-semantics
- id: api-bounded-list
  kind: positive
  status: frozen
  text: The customer listing loads every matching record into memory as the table grows. How should we
    cap the response?
  expect: backend-fundamentals.api.bound-collection-results
- id: api-bounded-list-paraphrase
  kind: positive
  status: frozen
  text: Clients can request a million items by changing page_size, despite our default of twenty. What
    limit belongs on this endpoint?
  expect: backend-fundamentals.api.bound-collection-results
- id: api-failure-contract
  kind: positive
  status: frozen
  text: Our REST endpoint catches a database outage and sends status 200 with an empty array, making callers
    think there are no orders.
  expect: backend-fundamentals.api.express-http-failures
- id: api-failure-contract-paraphrase
  kind: positive
  status: frozen
  text: Invalid input and a server crash both become HTTP 500. How should consumers distinguish these
    failures without seeing stack traces?
  expect: backend-fundamentals.api.express-http-failures
- id: security-entry
  kind: positive
  status: frozen
  text: The admin button is hidden for regular users but curl can still invoke its HTTP operation without
    credentials.
  expect: backend-fundamentals.security.enforce-protected-entry-access
- id: security-entry-paraphrase
  kind: positive
  status: frozen
  text: An internal admin route trusts a user ID header even though clients can bypass the identity gateway
    and send the header themselves.
  expect: backend-fundamentals.security.enforce-protected-entry-access
- id: security-resource
  kind: positive
  status: frozen
  text: Alice has a valid session and changes the invoice ID in the URL to read Bob's bill. Which permission
    is missing?
  expect: backend-fundamentals.security.authorize-target-resource
- id: security-resource-paraphrase
  kind: positive
  status: frozen
  text: A logged-in organization member updates a document in another tenant because the API checks only
    that the session exists.
  expect: backend-fundamentals.security.authorize-target-resource
- id: security-password
  kind: positive
  status: frozen
  text: Registration stores SHA256 of each password so login can compare it later. Is this suitable if
    the user table leaks?
  expect: backend-fundamentals.security.hash-passwords-for-storage
- id: security-password-paraphrase
  kind: positive
  status: frozen
  text: We plan to encrypt account secrets with a reversible key to verify future logins. What should
    be stored instead?
  expect: backend-fundamentals.security.hash-passwords-for-storage
- id: data-uniqueness
  kind: positive
  status: frozen
  text: Two simultaneous signups both find the email unused and both insert an account. How do we prevent
    duplicate committed rows?
  expect: backend-fundamentals.data.enforce-uniqueness-in-database
- id: data-uniqueness-paraphrase
  kind: positive
  status: frozen
  text: A SELECT before INSERT passes in two workers racing to claim the same booking reference. Where
    must the invariant be enforced?
  expect: backend-fundamentals.data.enforce-uniqueness-in-database
- id: data-atomicity
  kind: positive
  status: retired
  retired_reason: Pre-retrieval discipline check found a four-word overlap with Practice applicability.
  replacement_queries:
  - data-atomicity-v2
  text: Creating an order inserts its header but a later line-item write fails, leaving an incomplete
