policy: >-
  Skills are pinned research and candidate-discovery inputs, not normative authority.
  Primary documentation supports technical mechanisms. Practice decisions, severity,
  procedures, boundaries, and examples are independently authored synthesis.
authorship: >-
  No upstream Skill or primary-document prose or code is reproduced. All Practice
  examples are newly constructed illustrations, not observed incidents or executed
  implementations. Source links preserve provenance and do not relicense upstream
  material under the Pack's license.
pin_policy: >-
  Each Skill or reference is pinned to the first revision returned by its actual
  file-specific GitHub Atom commit feed when read on the research date. Each exact
  immutable raw file was then read. These are file-history snapshots, not claims
  about the latest repository-wide commits. Primary web pages are research-date
  snapshots; PostgreSQL URLs are versioned to 18, while OWASP and Stripe URLs can change.
